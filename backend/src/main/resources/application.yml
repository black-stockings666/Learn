server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: videonest-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:videonest}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
          max-interval: 5000ms

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expire-minutes: ${JWT_EXPIRE_MINUTES:1440}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:videonest}

video-process:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  timeout-seconds: ${VIDEO_PROCESS_TIMEOUT_SECONDS:1800}
  # 单机 Docker 环境默认同时执行两个转码任务，避免多个 FFmpeg 进程耗尽内存。
  # 可设置为 2-4，让 RabbitMQ 在任务积压时最多扩展至四个消费者。
  consumer-concurrency: ${VIDEO_PROCESS_CONSUMER_CONCURRENCY:2}

video-view-count:
  flush-delay-milliseconds: ${VIDEO_VIEW_COUNT_FLUSH_DELAY_MILLISECONDS:10000}
  batch-size: ${VIDEO_VIEW_COUNT_BATCH_SIZE:200}
  redis-ttl-seconds: ${VIDEO_VIEW_COUNT_REDIS_TTL_SECONDS:604800}

video-review:
  timeout-milliseconds: ${VIDEO_REVIEW_TIMEOUT_MILLISECONDS:86400000}

resource-cleanup:
  retention-days: ${RESOURCE_RETENTION_DAYS:7}
  fixed-delay-milliseconds: ${RESOURCE_CLEANUP_FIXED_DELAY_MILLISECONDS:3600000}
  batch-size: ${RESOURCE_CLEANUP_BATCH_SIZE:20}

logging:
  level:
    root: INFO
    com.example.demo: ${APP_LOG_LEVEL:INFO}
